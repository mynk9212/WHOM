<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Health Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #1a237e;
            margin-bottom: 5px;
        }
        .header p {
            color: #666;
            margin-top: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-title {
            font-size: 1.2rem;
            color: #757575;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .card-value {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 10px 0;
        }
        .unit {
            font-size: 1.2rem;
            color: #9e9e9e;
        }
        .hr-color { color: #e53935; }
        .spo2-color { color: #43a047; }
        .hb-color { color: #8e24aa; }
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #4caf50;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .connection-status {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Patient Vitals Monitor</h1>
        <p>Wireless Hemoglobin & Oxygen Monitoring System</p>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-title">Heart Rate</div>
            <div class="card-value hr-color" id="hr-value">--</div>
            <div class="unit">bpm</div>
        </div>
        
        <div class="card">
            <div class="card-title">Blood Oxygen (SpO₂)</div>
            <div class="card-value spo2-color" id="spo2-value">--</div>
            <div class="unit">%</div>
        </div>

        <div class="card">
            <div class="card-title">Hemoglobin (Est.)</div>
            <div class="card-value hb-color" id="hb-value">--</div>
            <div class="unit">g/dL</div>
        </div>
    </div>

    <div class="connection-status">
        <span class="status-dot" id="status-indicator"></span>
        <span id="status-text">Connected to Monitor</span>
    </div>

    <script>
        function updateDashboard() {
            fetch('/api/data')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    document.getElementById('hr-value').textContent = data.heart_rate || '--';
                    document.getElementById('spo2-value').textContent = data.spo2 || '--';
                    document.getElementById('hb-value').textContent = data.hemoglobin ? data.hemoglobin.toFixed(1) : '--';
                    
                    document.getElementById('status-indicator').style.backgroundColor = '#4caf50';
                    document.getElementById('status-text').textContent = 'Live tracking active';
                })
                .catch(error => {
                    document.getElementById('status-indicator').style.backgroundColor = '#f44336';
                    document.getElementById('status-text').textContent = 'Connection lost';
                });
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
